name: Build Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Verify tag, versions, and public source
        run: npm run release:check
      - run: npm run format:check
      - run: cargo fmt --all --check
      - run: npm test
      - run: npm run types:check
      - run: cargo test --locked --workspace
      - run: npx playwright install chromium
      - run: npm run test:ui
      - name: Build from locked source
        run: npm run tauri -- build -- --locked
      - name: Collect installer and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-installers | Out-Null
          Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' | Copy-Item -Destination dist-installers
          # 再放一份固定文件名的：README 的「一键下载」链到
          # releases/latest/download/QB-Gate-Windows-x64-setup.exe。文件名里带版本号的话，
          # 这个链接每发一版就断一次。按版本号挑，不按「目录里唯一那个」挑。
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $current = @(Get-ChildItem dist-installers -Filter "*_${version}_x64-setup.exe")
          if ($current.Count -ne 1) { throw "expected one installer for $version, found $($current.Count)" }
          Copy-Item -LiteralPath $current[0].FullName -Destination (Join-Path dist-installers 'QB-Gate-Windows-x64-setup.exe')
          $releaseLines = Get-ChildItem dist-installers -Filter '*.exe' | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $releaseLines | Set-Content dist-installers/SHA256SUMS.txt -Encoding ascii
          Copy-Item LICENSE,LICENSE-ADDITIONAL-TERMS.md,LICENSE-COMMERCIAL.md,ATTRIBUTION.md,THIRD_PARTY_NOTICES.txt -Destination dist-installers
          Copy-Item docs/dependencies.json -Destination dist-installers
      # 0.25.3 起：面板的「发现新版本」弹窗读 update.json（版本号 + 中文说明），
      # Release 正文也从同一份 .github/release-notes.md 生成。update.json 不进 SHA256SUMS ——
      # 它只提供版本号与说明，安装包的真假看 SHA256SUMS.txt。
      - name: Update manifest and release notes
        run: node scripts/update-manifest.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: qb-gate-windows
          path: dist-installers/*
      - name: Publish tagged build
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installers/*
          generate_release_notes: true
          body_path: target/release-body.md
