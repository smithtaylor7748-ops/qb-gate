name: Build Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Verify tag, versions, and public source
        run: npm run release:check
      - run: npm run format:check
      - run: cargo fmt --all --check
      - run: npm test
      - run: npm run types:check
      - run: cargo test --locked --workspace
      - run: npx playwright install chromium
      - run: npm run test:ui
      - name: Build from locked source
        run: npm run tauri -- build -- --locked
      - name: Collect installer and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-installers | Out-Null
          Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' | Copy-Item -Destination dist-installers
          $releaseLines = Get-ChildItem dist-installers -Filter '*.exe' | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $releaseLines | Set-Content dist-installers/SHA256SUMS.txt -Encoding ascii
          Copy-Item LICENSE,ATTRIBUTION.md,THIRD_PARTY_NOTICES.txt -Destination dist-installers
          Copy-Item docs/dependencies.json -Destination dist-installers
      - uses: actions/upload-artifact@v4
        with:
          name: qb-gate-windows
          path: dist-installers/*
      - name: Publish tagged build
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installers/*
          generate_release_notes: true
          body: |
            Windows 10 / 11 x64 安装包，由上方标签对应的源码在 GitHub Actions 上构建。安装包尚未做代码签名，下载后请对照 SHA256SUMS.txt 核对哈希。

            使用前请务必阅读 DISCLAIMER.md（免责声明）：本项目是非官方项目，不保证不被风控，不承诺防封。中转站功能（含智能调度）仍在内测，界面里已经出现，但暂时不能正常使用。

            问题反馈：GitHub Issues，或 QQ 群「门禁值班室」1109462206。

            Windows 10 / 11 x64. This installer was built from the source tag shown above.
            Verify the downloaded installer against SHA256SUMS.txt. This project does not yet configure code signing.
            Read README.md, DISCLAIMER.md and docs/MIGRATION-0.12.zh-CN.md before upgrading.
            Third-party notices and the source license are included with this release and inside the installer.
