name: Build Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - name: Verify tag, versions, and public source
        run: npm run release:check
      - run: npm run format:check
      - run: cargo fmt --all --check
      - run: npm test
      - run: npm run types:check
      - run: npm run test:browser-extension
      # 浏览器助手插件的分发目录（build/browser-extension）。安装包从这里取（tauri.conf.json 的
      # bundle.resources → 安装目录下的 browser-extension），下面还要把它打成发布附件。
      # src-tauri/build.rs 与 beforeBuildCommand 也会跑它；这里单独一步，失败时一眼看得出是插件。
      - name: Build the browser extension
        run: npm run build:browser-extension
      - run: cargo test --locked --workspace
      - run: npx playwright install chromium
      - run: npm run test:ui
      - name: Build from locked source
        run: npm run tauri -- build -- --locked
      - name: Collect installer and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-installers | Out-Null
          Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' | Copy-Item -Destination dist-installers
          # 再放一份固定文件名的：README 的「一键下载」链到
          # releases/latest/download/QB-Gate-Windows-x64-setup.exe。文件名里带版本号的话，
          # 这个链接每发一版就断一次。按版本号挑，不按「目录里唯一那个」挑。
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $current = @(Get-ChildItem dist-installers -Filter "*_${version}_x64-setup.exe")
          if ($current.Count -ne 1) { throw "expected one installer for $version, found $($current.Count)" }
          Copy-Item -LiteralPath $current[0].FullName -Destination (Join-Path dist-installers 'QB-Gate-Windows-x64-setup.exe')
          # 浏览器助手插件另附一份 zip（固定文件名，README 直链 releases/latest/download/QB-Gate-Browser-Extension.zip）。
          # 里面顶层是 browser-extension 文件夹，跟安装包装进安装目录的那一份是同一批文件。
          $extension = (Resolve-Path build/browser-extension).Path
          if (-not (Test-Path (Join-Path $extension 'manifest.json'))) { throw 'build/browser-extension has no manifest.json' }
          # 安装包里到底有没有插件：看 Tauri 生成的 NSIS 脚本里有没有往 browser-extension 装 manifest.json 那一行。
          $nsi = Get-ChildItem target/release/nsis -Recurse -Filter installer.nsi | Select-Object -First 1
          if (-not $nsi -or -not (Select-String -LiteralPath $nsi.FullName -SimpleMatch 'browser-extension\manifest.json' -Quiet)) { throw 'the installer does not carry browser-extension\manifest.json' }
          $extensionVersion = (Get-Content (Join-Path $extension 'manifest.json') -Raw | ConvertFrom-Json).version
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path (Resolve-Path dist-installers) 'QB-Gate-Browser-Extension.zip'
          [System.IO.Compression.ZipFile]::CreateFromDirectory($extension, $zip, [System.IO.Compression.CompressionLevel]::Optimal, $true)
          Write-Host "browser extension $extensionVersion -> $zip"
          # SHA256SUMS 收安装包和插件 zip。面板的一键更新只认安装包那两行（self_update::expected_sha256），别的行它跳过。
          $releaseLines = Get-ChildItem dist-installers | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $releaseLines | Set-Content dist-installers/SHA256SUMS.txt -Encoding ascii
          Copy-Item LICENSE,LICENSE-ADDITIONAL-TERMS.md,LICENSE-COMMERCIAL.md,THIRD_PARTY_NOTICES.txt -Destination dist-installers
          Copy-Item docs/dependencies.json -Destination dist-installers
      # 0.25.3 起：面板的「发现新版本」弹窗读 update.json（版本号 + 中文说明），
      # Release 正文也从同一份 .github/release-notes.md 生成。update.json 不进 SHA256SUMS ——
      # 它只提供版本号与说明，安装包的真假看 SHA256SUMS.txt。
      - name: Update manifest and release notes
        run: node scripts/update-manifest.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: qb-gate-windows
          path: dist-installers/*
      - name: Publish tagged build
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installers/*
          generate_release_notes: true
          body_path: target/release-body.md
