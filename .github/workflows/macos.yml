name: Build macOS Apple Silicon
on:
  push:
    branches: ['codex/macos-port-*']
  pull_request:
    paths:
      - 'crates/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'Cargo.*'
      - 'package*.json'
      - '.github/workflows/macos.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apple-silicon:
    # Standard arm64 runner, not the paid -large/-xlarge runner.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v5
      - name: Verify native Apple Silicon runner
        run: test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run release:check
      - run: npm run format:check
      - run: cargo fmt --all --check
      - run: npm test
      - run: npm run types:check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --lib -- -D warnings
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: node scripts/macos-ui-smoke.mjs
      - name: Build native app and disk image
        run: npm run build:mac
      - name: Verify arm64 executable and bundle signature
        run: |
          app='target/aarch64-apple-darwin/release/bundle/macos/QB Gate.app'
          test "$(lipo -archs "$app/Contents/MacOS/qb-gate")" = arm64
          codesign --verify --deep --strict "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: qb-gate-macos-arm64
          path: dist-installers/*
          if-no-files-found: error
          retention-days: 14
