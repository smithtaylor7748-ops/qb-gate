name: Build macOS Apple Silicon
on:
  push:
    branches: ['codex/macos-port-*']
  pull_request:
    paths:
      - 'crates/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'Cargo.*'
      - 'package*.json'
      - '.github/workflows/macos.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  source-checks:
    # Standard arm64 runner, not the paid -large/-xlarge runner.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v5
      - name: Verify native Apple Silicon runner
        run: test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: npm ci
      - run: npm run release:check
      - run: npm run format:check
      - run: cargo fmt --all --check
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: node scripts/macos-ui-smoke.mjs
      - run: npm run types:check
      - run: cargo test --locked --workspace --no-fail-fast
      - run: cargo clippy --locked --workspace --lib -- -D warnings
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-layout-failure
          path: test-results/accounts-*.png
          if-no-files-found: ignore
          retention-days: 14
  apple-silicon:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v5
      - name: Verify native Apple Silicon runner
        run: test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: npm ci
      - name: Build native app and disk image
        run: npm run build:mac
      - name: Verify arm64 executable and bundle signature
        run: |
          app='target/aarch64-apple-darwin/release/bundle/macos/QB Gate.app'
          test "$(lipo -archs "$app/Contents/MacOS/qb-gate")" = arm64
          codesign --verify --deep --strict "$app"
      - name: Mount disk image and launch real native WebView
        run: node scripts/macos-app-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-native-validation
          path: test-results/macos-native/*
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: qb-gate-macos-arm64
          path: dist-installers/*
          if-no-files-found: error
          retention-days: 14
  native-runtime:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v5
      - name: Verify native Apple Silicon runner
        run: test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build native runtime smoke
        run: cargo build --locked -p qb-platform --example macos-runtime-smoke
      - name: Verify isolated Keychain and managed processes
        run: node scripts/macos-runtime-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-runtime-validation
          path: docs/macos-runtime-smoke.log
          if-no-files-found: ignore
          retention-days: 14
  official-cli-install:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v5
      - name: Verify native Apple Silicon runner
        run: test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build official CLI installation validation
        run: |
          set -o pipefail
          cargo build --locked -p qb-install --example macos-install-smoke 2>&1 | tee macos-install-smoke.log
      - name: Install official Claude and Codex binaries and verify rollback
        env:
          QB_GATE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          target/debug/examples/macos-install-smoke 2>&1 | tee -a macos-install-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-official-cli-validation
          path: macos-install-smoke.log
          if-no-files-found: error
          retention-days: 14
