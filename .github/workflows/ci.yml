name: CI
on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      # 实测当前 0 漏洞，所以直接当硬门。
      - name: npm advisories
        run: npm audit --audit-level=moderate
      - name: Public source and version checks
        run: npm run release:check
      # 两条分成两步，别合回一个 `run: |`。Windows runner 的默认 shell 是 pwsh，
      # 多行脚本只看最后一条命令的退出码 —— 合在一起时 Prettier 红了、cargo fmt 绿了，
      # 这一步照样报成功（v0.22.6 发布时 release.yml 在 Prettier 上红，这里却是绿的）。
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Formatting (rustfmt)
        run: cargo fmt --all --check
      - run: npm test
      - run: npm run types:check
      - run: npm run build
      - name: Isolated Rust regressions
        run: cargo test --locked --workspace
      # 判定函数的可见性收窄到 pub(super) 靠的就是这道门：一旦有人把判定
      # 搬回调用方自己写一遍，原函数变成 dead_code，这里直接编译失败。
      # 以前这条只在本地跑过，CI 里是空的。
      - name: Lints
        run: cargo clippy --locked --workspace --lib -- -D warnings
      - name: Browser runtime
        run: npx playwright install chromium
      - name: Demo UI regression with external requests blocked
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-regression
          path: |
            docs/ui-regression.json
            docs/screenshots/*-light.png
            docs/screenshots/*-dark.png

  # 供应链。单独一个 job：它不需要 npm、不需要 Windows，也不该拖慢主回归。
  #
  # 四档的松紧在仓库根的 deny.toml 里逐条解释过，都是实测之后定的：
  # 漏洞 0 个当硬门，无人维护 6 个与重复版本 94 处只报不拦 ——
  # 把改不动的东西设成硬门，结果是有人把整道门关掉。
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
